name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Install packages
      run: |
        # Install local packages in dependency order. Let each package's
        # metadata provide its complete third-party dependency set so CI and
        # local type checking cannot silently drift apart.
        pip install -e "packages/pig-llm[all]" -e packages/pig-tui
        pip install -e packages/pig-agent-core -e packages/pig-web-ui
        pip install -e packages/pig-coding-agent \
          -e "packages/pig-messenger[redis,encryption,slack,discord,whatsapp,telegram,feishu]"
      shell: bash

    - name: Run linting
      shell: bash
      run: |
        ruff check packages/ tests/ scripts/verify_release.py scripts/verify_minimal_pig_llm.py
        ruff format --check packages/ tests/ scripts/verify_release.py scripts/verify_minimal_pig_llm.py

    - name: Run type checking
      shell: bash
      run: |
        ./scripts/typecheck.sh

    - name: Run tests
      shell: bash
      run: |
        # Run root tests separately, then each package
        # (avoids conftest.py module name collisions across packages)
        pytest tests/ -v --cov=packages --cov-report=term
        for pkg in packages/*/; do
          if [ -d "$pkg/tests" ]; then
            pytest "$pkg/tests" -v --cov=packages --cov-append
          fi
        done
        # Generate final coverage report
        coverage xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build packages
      run: |
        for pkg in packages/*/; do
          if [ -f "$pkg/pyproject.toml" ]; then
            echo "Building $pkg..."
            python -m build "$pkg"
          fi
        done

    - name: Check distributions
      run: |
        twine check packages/*/dist/*

    - name: Verify dependency-light pig-llm wheel
      run: |
        python -m venv /tmp/pig-llm-minimal
        /tmp/pig-llm-minimal/bin/python -m pip install packages/pig-llm/dist/*.whl
        /tmp/pig-llm-minimal/bin/python scripts/verify_minimal_pig_llm.py

  docs:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check documentation
      run: |
        # Check all packages have READMEs
        for pkg in packages/*/; do
          if [ ! -f "$pkg/README.md" ]; then
            echo "Missing README in $pkg"
            exit 1
          fi
        done

        echo "✓ All packages have documentation"
