name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Verify release metadata
      run: python scripts/verify_release.py --tag "${GITHUB_REF_NAME}"

    - name: Set reproducible build timestamp
      run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

    - name: Build packages
      run: |
        for pkg in packages/*/; do
          if [ -f "$pkg/pyproject.toml" ]; then
            echo "Building $pkg..."
            python -m build "$pkg"
          fi
        done

    - name: Gather and check distributions
      run: |
        mkdir -p dist
        cp packages/*/dist/* dist/
        twine check dist/*

    - name: Upload verified distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
        if-no-files-found: error

  # Trusted Publishing uses GitHub OIDC. The environment must allow v* tags,
  # and every PyPI project must trust this workflow and environment.
  pypi-publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download verified distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        # Supports recovery from a partially completed multi-package publish.
        # The next job still requires every published digest to match this build.
        skip-existing: true

  verify-published:
    needs: [build, pypi-publish]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download verified distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Verify PyPI artifact integrity
      run: >-
        python scripts/verify_release.py
        --tag "${GITHUB_REF_NAME}"
        --published-dist dist

  github-release:
    needs: [build, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download published distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
