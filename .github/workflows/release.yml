name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the GitHub Release

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install build tooling
      run: |
        python -m pip install --upgrade pip
        pip install build

    - name: Build packages
      run: |
        for pkg in packages/*/; do
          if [ -f "$pkg/pyproject.toml" ]; then
            echo "Building $pkg..."
            python -m build "$pkg"
          fi
        done

    # Collect every package's artifacts into one dir so both the GitHub
    # Release and the PyPI publish step have a single source of truth.
    - name: Gather distributions
      run: |
        mkdir -p dist
        cp packages/*/dist/* dist/
        ls -l dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload distributions for the publish job
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  # Separate job so a PyPI misconfiguration can never undo the GitHub Release
  # above. Uses PyPI Trusted Publishing (OIDC) — no token/secret required, but
  # each project must have a trusted publisher configured on PyPI first (see
  # the note below). skip-existing keeps re-tagging from failing on versions
  # that are already published (e.g. unchanged packages on a later tag).
  pypi-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # mint the OIDC token for Trusted Publishing

    steps:
    - name: Download built distributions
      uses: actions/download-artifact@v4
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: dist/
        skip-existing: true

# One-time PyPI setup required before the pypi-publish job can succeed:
#   1. For each package (pig-llm, pig-agent-core, pig-coding-agent, pig-tui,
#      pig-messenger, pig-web-ui), add a Trusted Publisher on
#      PyPI -> Project -> Settings -> Publishing (or a "pending publisher" for
#      first-ever uploads) with:
#         Owner:    kangkona
#         Repo:     pig-mono
#         Workflow: release.yml
#         Environment: pypi
#   2. Create a GitHub Environment named "pypi" (Settings -> Environments) —
#      optionally add required reviewers to gate publishes.
#
# Prefer an API token instead of Trusted Publishing? Replace the publish step
# with the token form and add a PYPI_TOKEN secret:
#     - name: Publish to PyPI
#       uses: pypa/gh-action-pypi-publish@release/v1
#       with:
#         packages-dir: dist/
#         skip-existing: true
#         password: ${{ secrets.PYPI_TOKEN }}
#   (the id-token permission is then unnecessary).
