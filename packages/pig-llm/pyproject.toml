[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pig-llm"
version = "0.2.0"
description = "Unified multi-provider LLM API (OpenAI, Anthropic, Google, etc.)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Kangkona", email = "kangkona@gmail.com" }
]

dependencies = [
    "pydantic>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/kangkona/pig-mono"
Repository = "https://github.com/kangkona/pig-mono"
Issues = "https://github.com/kangkona/pig-mono/issues"

[project.optional-dependencies]
openai = [
    "openai>=1.12.0",
]
anthropic = [
    "anthropic>=0.18.0",
]
google = [
    "google-genai>=0.1.0",
]
groq = [
    "groq>=0.4.0",
]
mistral = [
    "mistralai>=0.1.0",
]
bedrock = [
    "boto3>=1.34.0",
]
cohere = [
    "cohere>=7.0.8",
]
all = [
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "cohere>=7.0.8",
    "google-genai>=0.1.0",
    "groq>=0.4.0",
    "mistralai>=0.1.0",
    "openai>=1.12.0",
]
dev = [
    "anthropic>=0.18.0",
    "boto3>=1.34.0",
    "cohere>=7.0.8",
    "google-genai>=0.1.0",
    "groq>=0.4.0",
    "mistralai>=0.1.0",
    "openai>=1.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pig_llm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]
