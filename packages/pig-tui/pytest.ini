[pytest]
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src/pig_tui
    --cov-report=term-missing
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = .* build dist CVS _darcs {arch} *.egg venv .venv examples
filterwarnings =
    ignore::DeprecationWarning
